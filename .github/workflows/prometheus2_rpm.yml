name: Build EL8/EL9/EL10 RPMs

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (e.g. v0.4.10)'
        required: true
        default: ''
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true

jobs:
  build-rpm:
    name: Build ${{ matrix.package }} RPM for EL${{ matrix.el }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        el:
          - 8
          - 9
          - 10
        package:
          - prometheus2
          - systemd_exporter
          - node_exporter
          - kafka_exporter
          - mongodb_exporter
          - fishymetrics
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      # No explicit "docker build" step here: the Makefile declares
      # build-rocky10-image as a prerequisite wherever it's actually needed
      # (build10-* targets, and fishymetrics-tarball for any EL version), so
      # make builds it automatically only when required. Building it
      # unconditionally here would waste time on the el8/el9 non-fishymetrics
      # jobs, which never touch that image.
      - name: Build ${{ matrix.package }} RPM
        run: make build${{ matrix.el }}-${{ matrix.package }}

      - name: Resolve dist directory
        id: dist
        run: |
          if [ "${{ matrix.el }}" = "10" ]; then
            echo "dir=_dist10_RPM" >> "$GITHUB_OUTPUT"
          else
            echo "dir=_dist${{ matrix.el }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Binary RPM
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-el${{ matrix.el }}-rpm
          path: ${{ steps.dist.outputs.dir }}/*.rpm
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_name }}
          name: ${{ inputs.release_name }}
          draft: ${{ inputs.draft }}
          files: ${{ steps.dist.outputs.dir }}/*.rpm
